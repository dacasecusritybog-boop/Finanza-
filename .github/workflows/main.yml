
name: Compilar Mis Finanzas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar herramientas Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extraer proyecto
        shell: bash
        run: |
          set -e

          if [ ! -f android/gradlew ]; then
            ZIP="Mis-Finanzas-Supabase-configurado.zip"

            if [ ! -f "$ZIP" ]; then
              echo "ERROR: No se encontró $ZIP"
              ls -la
              exit 1
            fi

            unzip -oq "$ZIP" -d .
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: El ZIP no contiene android/gradlew"
            find . -maxdepth 4 -name gradlew -print
            exit 1
          fi

          chmod +x android/gradlew
          echo "Proyecto extraído correctamente."

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mis-Finanzas-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
