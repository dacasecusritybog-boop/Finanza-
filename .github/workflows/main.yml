
name: Compilar Mis Finanzas APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar SDK Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extraer proyecto
        shell: bash
        run: |
          set -e
          if [ ! -f android/gradlew ]; then
            ZIP="Mis-Finanzas-Supabase-configurado.zip"
            test -f "$ZIP" || {
              echo "No se encontró el ZIP del proyecto"
              exit 1
            }
            unzip -oq "$ZIP" -d .
          fi
          test -f package.json
          test -f package-lock.json
          test -f android/gradlew

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mis-Finanzas-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
