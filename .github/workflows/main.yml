
name: Compilar Mis Finanzas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extraer y localizar proyecto
        shell: bash
        run: |
          set -e
          ZIP="Mis-Finanzas-Supabase-configurado.zip"
          if [ -f "$ZIP" ]; then
            unzip -oq "$ZIP" -d proyecto-extraido
          fi

          PACKAGE=$(find . -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/.git/*' -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: No se encontró package.json"
            exit 1
          fi

          DIR=$(dirname "$PACKAGE")
          test -f "$DIR/android/gradlew" || {
            echo "ERROR: Falta android/gradlew en $DIR"
            exit 1
          }

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Sincronizar Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mis-Finanzas-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
